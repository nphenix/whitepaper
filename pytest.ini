[pytest]
# pytest最低版本要求
minversion = 6.0

# 默认参数
addopts = 
    -ra
    -q
    --strict-markers
    --strict-config
    --cov=src
    --cov=cli
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --tb=short

# Python路径（添加项目根目录）
pythonpath = .

# 测试路径
testpaths = tests

# 测试文件匹配模式
python_files = 
    test_*.py
    *_test.py

# 测试类匹配模式
python_classes = 
    Test*

# 测试函数匹配模式
python_functions = 
    test_*

# 自定义标记
markers =
    slow: 标记为慢速测试（使用 '-m "not slow"' 跳过）
    integration: 标记为集成测试
    unit: 标记为单元测试
    contract: 标记为契约测试
    api: 标记为API测试
    cli: 标记为CLI测试
    agent: 标记为Agent测试
    infrastructure: 标记为基础设施测试
    requires_redis: 需要Redis服务的测试
    requires_chroma: 需要ChromaDB的测试
    e2e: 标记为端到端测试
    browser: 标记为浏览器测试（需要Playwright）

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:chromadb.*
    ignore::UserWarning:llama_index.*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试发现
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    htmlcov

# 并行测试（如果安装了pytest-xdist）
# 使用方法: pytest -n auto
# 注意：需要安装 pytest-xdist: pip install pytest-xdist
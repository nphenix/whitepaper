# Ruff 配置文件
# 用于代码格式化和 linting 工具

# 基本配置
line-length = 88
target-version = "py312"

# Linting 配置
[lint]
# 启用的规则集
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "A",   # flake8-builtins
    "C90", # mccabe
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "FA",  # flake8-future-annotations
    "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "LOG", # flake8-logging
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "YTT", # flake8-2020
    "S",   # flake8-bandit
]

# 忽略的规则
ignore = [
    "E501",    # line too long, handled by black
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "S101",    # use of assert detected
    "S311",    # standard pseudo-random generators are not suitable for security purposes
    "S603",    # subprocess call: check for execution of untrusted input
    "T201",    # print found
    "T203",    # pprint found
    "G201",    # allow exc_info logging without logger.exception
    "LOG015",  # allow root logger usage in legacy paths
    "RUF012",  # allow mutable class attributes without ClassVar
    "PTH110",  # allow os.path.exists for now
    "PTH116",  # allow os.stat for now
    "PTH123",  # allow built-in open for now
    "TID252",  # allow relative imports from parent modules
    "B904",    # allow bare raise in except blocks
    "SIM102",  # allow nested ifs
    "SIM117",  # allow nested with statements
    "PGH003",  # allow broad type ignores
    "S104",    # allow binding to all interfaces where intended
    "S110",    # allow bare try/except pass in legacy code
    "RET504",  # unnecessary assignment before return
    "RET505",  # unnecessary else after return
    "RET506",  # unnecessary else after raise
    "RET507",  # unnecessary else after continue
    "RET508",  # unnecessary else after break
    "FBT001",  # allow boolean positional args in current codebase
    "FBT002",  # allow boolean default positional args in current codebase
    "FBT003",  # allow boolean positional values in function calls
    "G004",    # allow f-string logging, consistent with existing style
    "A001",    # allow builtin shadowing in CLI command names
    "A002",    # allow builtin shadowing in argument names
    "PT028",   # allow Typer command defaults
]

# 每个文件的忽略规则
[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S311", "T201", "T203"]
"scripts/*" = ["T201", "T203"]

# isort 配置
[lint.isort]
known-first-party = ["src", "cli"]
split-on-trailing-comma = true
combine-as-imports = true

# McCabe 复杂度检查
[lint.mccabe]
max-complexity = 10

# flake8-quotes
[lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

# 格式化配置
[format]
# 使用双引号
quote-style = "double"
# 缩进风格
indent-style = "space"
# 自动检测行结束符
line-ending = "auto"
# 跳过魔术尾随逗号
skip-magic-trailing-comma = false